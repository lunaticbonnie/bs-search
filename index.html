<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_downward,chevron_right" />
  <link rel="stylesheet" href="qiss.css" />
  <style>
    html {
      overflow-y: scroll;
    }
    body {
      background: #272831;
      background: #222225;
      color: white;
      font-family: "Motiva Sans", sans-serif;
      font-size: 16px;
    }
    .icon {
      user-select: none;
    }
    .icon-button {
      color: #c6d4df;
      cursor: default;
    }
    .icon-button[data-disabled="false"] {
      cursor: pointer;
    }
    .icon-button[data-disabled="false"]:hover {
      color: white;
    }
    hr {
      border-color: #c6d4df;
    }

    a {
      color: #66C0F4;
      text-decoration: none;
    }
    .table {
      width: 100%;
      padding: 4px;
      gap: 6px;
    }
    .table-row {
      width: 100%;
    }
    .table-row:nth-child(2n) {
      /*background: #25252c;*/
    }
    .table-header-row {
      font-size: 20px;
    }
    .table-header[data-sortable="true"] {
      cursor: pointer;
      user-select: none;
    }
    .table-sort-arrow {
      font-size: 18px;
      opacity: 0;
      transition: transform 100ms;
    }
    .table-header[data-sortable="true"]:hover .table-sort-arrow {
      opacity: .5;
    }
    .table-header[data-sort="desc"] .table-sort-arrow {
      opacity: 1 !important;
    }
    .table-header[data-sort="asc"] .table-sort-arrow {
      opacity: 1 !important;
      transform: rotate(180deg);
    }
    .tags {
      padding: 2px;
    }
    .tag {
      display: inline-block;
      line-height: 19px;
      padding: 0 7px;
      color: #acb2b8;
      background: rgba(103, 193, 245, 0.2);
      box-shadow: none;
      margin-right: 2px;
      border-radius: 2px;
      font-size: 16px;
    }
    .tag-highlight {
      color: #798a95;
    }
  </style>
  <script type="module" src="app.mjs"></script>
</head>
<body>
</body>
</html>
